# K3 (BCM4709, 512MB) 系统优化
# BBR 拥塞控制 + fq (fq 给所有出口包做 pacing，含 UDP)
net.ipv4.tcp_congestion_control=bbr
net.core.default_qdisc=fq
net.core.netdev_max_backlog=10000
# TCP 优化
net.ipv4.tcp_slow_start_after_idle=0
net.ipv4.tcp_notsent_lowat=16384
net.ipv4.tcp_fastopen=3
net.ipv4.tcp_mtu_probing=1
# 连接跟踪 (512MB 保守值)
net.netfilter.nf_conntrack_max=32768
net.netfilter.nf_conntrack_tcp_timeout_established=7440
# 本地端口范围
net.ipv4.ip_local_port_range=1024 65535
# --- 高爆发：TCP 缓冲 + NAPI 预算 (512MB 保守) ---
net.ipv4.tcp_rmem=4096 87380 8388608
net.ipv4.tcp_wmem=4096 65536 8388608
net.core.netdev_budget=400
net.core.netdev_budget_usecs=8000
# 低延迟：busy polling (双核保守 30us)
net.core.busy_poll=30
net.core.busy_read=30
# IPv6
net.ipv6.conf.all.forwarding=1
# IPv4 转发 (NAT 二级路由必须)
net.ipv4.ip_forward=1
# rp_filter 松散模式 (NAT 环境严格模式会导致回包被丢)
net.ipv4.conf.default.rp_filter=2
net.ipv4.conf.all.rp_filter=2
# --- HY2/QUIC: UDP 缓冲 ---
net.core.rmem_max=16777216
net.core.wmem_max=16777216
net.core.rmem_default=4194304
net.core.wmem_default=4194304
net.ipv4.udp_rmem_min=8192
net.ipv4.udp_wmem_min=8192
# --- 内存管理 (512MB) ---
vm.min_free_kbytes=16384
vm.vfs_cache_pressure=150
