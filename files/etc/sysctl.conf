# K3 (BCM4709C0 双核 A9 1.4GHz, 512MB) —— 路由转发 + sing-box HY2 调优

# 拥塞控制 / 队列：路由器转发用 fq_codel（比 fq 省 CPU、抗缓冲膨胀）
# BBR 自带 pacing；quic-go(HY2) 在用户态自己做 pacing，不依赖 fq
net.ipv4.tcp_congestion_control=bbr
net.core.default_qdisc=fq_codel

# 软中断：预算加大减少 ksoftirqd 往返，但别饿死 sing-box（不再用 8ms）
net.core.netdev_max_backlog=4096
net.core.netdev_budget=600
net.core.netdev_budget_usecs=4000
# busy_poll 已删除：它让 CPU 空转等包，在双核路由上纯浪费

# TCP（路由器本机连接）
net.ipv4.tcp_slow_start_after_idle=0
net.ipv4.tcp_notsent_lowat=16384
net.ipv4.tcp_fastopen=3
net.ipv4.tcp_mtu_probing=1
net.ipv4.tcp_rmem=4096 131072 6291456
net.ipv4.tcp_wmem=4096 65536 6291456
net.ipv4.ip_local_port_range=1024 65535

# HY2/QUIC：quic-go 会主动申请 ~7MB 收发缓冲，max 必须 >= 7.5MB 否则限速并报警告
# default 保持小值：以前 default=4MB 会让每个 socket 都吃 4MB，512MB 内存扛不住
net.core.rmem_max=8388608
net.core.wmem_max=8388608
net.core.rmem_default=262144
net.core.wmem_default=262144
net.ipv4.udp_rmem_min=16384
net.ipv4.udp_wmem_min=16384

# 连接跟踪
net.netfilter.nf_conntrack_max=65535
net.netfilter.nf_conntrack_tcp_timeout_established=7440
net.netfilter.nf_conntrack_udp_timeout=30
net.netfilter.nf_conntrack_udp_timeout_stream=120

# 转发
net.ipv4.ip_forward=1
net.ipv6.conf.all.forwarding=1
net.ipv4.conf.default.rp_filter=2
net.ipv4.conf.all.rp_filter=2

# 内存
vm.swappiness=10
vm.min_free_kbytes=16384
vm.vfs_cache_pressure=150
